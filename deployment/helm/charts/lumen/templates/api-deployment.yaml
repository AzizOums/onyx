{{- if gt (int .Values.api.replicaCount) 0 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumen.resourceName" (list . "api-server") }}
  labels:
    {{- include "lumen.labels" . | nindent 4 }}
    {{- with .Values.api.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lumen.selectorLabels" . | nindent 6 }}
      {{- if .Values.api.deploymentLabels }}
      {{- toYaml .Values.api.deploymentLabels | nindent 6 }}
      {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- $pgIntoChecksum := include "lumen.pgInto.checksumAnnotation" . }}
        {{- if $pgIntoChecksum }}
        {{- $pgIntoChecksum | nindent 8 }}
        {{- end }}
      {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lumen.labels" . | nindent 8 }}
        {{- with .Values.api.deploymentLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lumen.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-server
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Values.global.version }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          command:
            - "/bin/sh"
            - "-c"
            - |
              {{- if or .Values.api.runUpdateCaCertificates (include "lumen.customCACerts.enabled" .) }}
              update-ca-certificates &&
              {{- end }}
              {{- if or (not (hasKey .Values.api "runStartupMigrations")) .Values.api.runStartupMigrations }}
              alembic upgrade head &&
              {{- end }}
              echo "Starting Lumen Api Server" &&
              uvicorn lumen.main:app --host {{ .Values.global.host }} --port {{ .Values.api.containerPorts.server }}{{ if gt (int (.Values.api.workers | default 1)) 1 }} --workers {{ .Values.api.workers }}{{ end }}{{ if .Values.api.limitConcurrency }} --limit-concurrency {{ .Values.api.limitConcurrency }}{{ end }}
          ports:
            - name: api-server-port
              containerPort: {{ .Values.api.containerPorts.server }}
              protocol: TCP
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- with .Values.api.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.envConfigMapName }}
            {{- with .Values.extraEnvFromSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            {{- if .Values.api.threadpoolSize }}
            - name: LUMEN_API_THREADPOOL_SIZE
              value: "{{ .Values.api.threadpoolSize }}"
            {{- end }}
            {{- include "lumen.envSecrets" . | nindent 12}}
            {{- include "lumen.envSecretsRestricted" . | nindent 12}}
            {{- include "lumen.metricsAuthEnv" . | nindent 12}}
            {{- with include "lumen.customCACerts.env" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- $apiVolumeMounts := include "lumen.renderVolumeMounts" (dict "ctx" . "volumeMounts" .Values.api.volumeMounts) }}
          {{- if $apiVolumeMounts }}
          {{- $apiVolumeMounts | nindent 10 }}
          {{- end }}
      {{- $apiVolumes := include "lumen.renderVolumes" (dict "ctx" . "volumes" .Values.api.volumes) }}
      {{- if $apiVolumes }}
      {{- $apiVolumes | nindent 6 }}
      {{- end }}
{{- end }}
