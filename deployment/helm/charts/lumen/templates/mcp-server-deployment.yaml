{{- if .Values.mcpServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumen.resourceName" (list . "mcp-server") }}
  labels:
    {{- include "lumen.labels" . | nindent 4 }}
    {{- with .Values.mcpServer.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.mcpServer.replicaCount }}
  selector:
    matchLabels:
      {{- include "lumen.selectorLabels" . | nindent 6 }}
      {{- if .Values.mcpServer.deploymentLabels }}
      {{- toYaml .Values.mcpServer.deploymentLabels | nindent 6 }}
      {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.mcpServer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lumen.labels" . | nindent 8 }}
        {{- with .Values.mcpServer.deploymentLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.mcpServer.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lumen.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.mcpServer.podSecurityContext | nindent 8 }}
      {{- with .Values.mcpServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mcp-server
          securityContext:
            {{- toYaml .Values.mcpServer.securityContext | nindent 12 }}
          {{- if eq .Values.mcpServer.runtime "rust" }}
          image: "{{ .Values.mcpServer.rustImage.repository }}:{{ .Values.mcpServer.rustImage.tag | default .Values.global.version }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          {{- else }}
          image: "{{ .Values.mcpServer.image.repository }}:{{ .Values.mcpServer.image.tag | default .Values.global.version }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          command: [{{ include "lumen.customCACerts.commandPrefix" . }}"python", "lumen/mcp_server_main.py"]
          {{- end }}
          ports:
            - name: mcp-server-port
              containerPort: {{ .Values.mcpServer.containerPorts.server }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: mcp-server-port
            initialDelaySeconds: {{ .Values.mcpServer.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mcpServer.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.mcpServer.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.mcpServer.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: mcp-server-port
            initialDelaySeconds: {{ .Values.mcpServer.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.mcpServer.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.mcpServer.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.mcpServer.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.mcpServer.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.envConfigMapName }}
            {{- with .Values.extraEnvFromSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            - name: MCP_SERVER_ENABLED
              value: "true"
            - name: MCP_SERVER_PORT
              value: "{{ .Values.mcpServer.containerPorts.server }}"
            - name: MCP_SERVER_HOST
              value: "{{ .Values.global.host }}"
            {{- if .Values.mcpServer.corsOrigins }}
            - name: MCP_SERVER_CORS_ORIGINS
              value: "{{ .Values.mcpServer.corsOrigins }}"
            {{- end }}
            # API server connection for authentication and proxying
            # Uses full override variable to set the port instead of using default 8080
            - name: API_SERVER_URL_OVERRIDE_FOR_HTTP_REQUESTS
              value: "http://{{ include "lumen.resourceName" (list . "api-service") }}:{{ .Values.api.service.servicePort }}"
            {{- include "lumen.envSecrets" . | nindent 12 }}
            {{- include "lumen.metricsAuthEnv" . | nindent 12 }}
            {{- if eq .Values.mcpServer.runtime "rust" }}
            {{- with include "lumen.customCACerts.modelServerEnv" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- else }}
            {{- with include "lumen.customCACerts.env" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- with .Values.mcpServer.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if eq .Values.mcpServer.runtime "rust" }}
          {{- with include "lumen.modelServer.volumeMountsWithCA" (dict "ctx" . "volumeMounts" .Values.mcpServer.volumeMounts) }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- else }}
          {{- with include "lumen.volumeMountsWithCA" (dict "ctx" . "volumeMounts" .Values.mcpServer.volumeMounts) }}
          {{- . | nindent 10 }}
          {{- end }}
          {{- end }}
      {{- if eq .Values.mcpServer.runtime "rust" }}
      {{- with include "lumen.modelServer.volumesWithCA" (dict "ctx" . "volumes" .Values.mcpServer.volumes) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- else }}
      {{- with include "lumen.volumesWithCA" (dict "ctx" . "volumes" .Values.mcpServer.volumes) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- end }}
{{- end }}

