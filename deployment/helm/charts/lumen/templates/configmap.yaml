apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.config.envConfigMapName }}
  labels:
    {{- include "lumen.labels" . | nindent 4 }}
data:
  {{- $craftEnabled := eq (include "lumen.craftEnabled" .) "true" }}
  INTERNAL_URL: "http://{{ include "lumen.resourceName" (list . "api-service") }}:{{ .Values.api.service.servicePort | default 8080 }}"
  {{- if .Values.postgresql.enabled }}
  POSTGRES_HOST: {{ .Release.Name }}-pg-rw
  {{- end }}
  {{- if .Values.opensearch.enabled }}
  OPENSEARCH_HOST: {{ .Values.opensearch.clusterName }}-{{ .Values.opensearch.nodeGroup }}.{{ .Release.Namespace }}.svc.cluster.local
  OPENSEARCH_REST_API_PORT: "9200"
  ENABLE_OPENSEARCH_INDEXING_FOR_LUMEN: "true"
  ENABLE_OPENSEARCH_RETRIEVAL_FOR_LUMEN: "false"
  {{- end }}
  {{- if .Values.redis.enabled }}
  # Standalone Redis CR produces a Service named after the CR (no `-master`
  # suffix — that suffix is only for RedisReplication CRs).
  REDIS_HOST: {{ .Values.redis.redisStandalone.name | default .Release.Name }}
  {{- end }}
  {{- /* configMap overrides win (rendered by the range below) — emitting the
  default too would produce a duplicate YAML key. */}}
  {{- if not (index .Values.configMap "MODEL_SERVER_HOST") }}
  MODEL_SERVER_HOST: "{{ include "lumen.resourceName" (list . "inference-model-service") }}"
  {{- end }}
  {{- if .Values.vectorDB.enabled }}
  {{- if not (index .Values.configMap "INDEXING_MODEL_SERVER_HOST") }}
  INDEXING_MODEL_SERVER_HOST: "{{ include "lumen.resourceName" (list . "indexing-model-service") }}"
  {{- end }}
  DISABLE_VECTOR_DB: "false"
  {{- else }}
  DISABLE_VECTOR_DB: "true"
  {{- end }}
{{- range $key, $value := .Values.configMap }}
{{- $skipCraftProxyKey := and $craftEnabled (or (eq $key "SANDBOX_PROXY_HOST") (eq $key "SANDBOX_PROXY_PORT")) }}
{{- $skipPostgresTlsKey := and (eq (include "lumen.postgresTls.enabled" $) "true") (or (eq $key "POSTGRES_SSLMODE") (eq $key "POSTGRES_SSLROOTCERT")) }}
{{- $skipRedisTlsKey := and (eq (include "lumen.redisTls.enabled" $) "true") (or (eq $key "REDIS_SSL") (eq $key "REDIS_SSL_CERT_REQS") (eq $key "REDIS_SSL_CA_CERTS") (eq $key "REDIS_SSL_CHECK_HOSTNAME")) }}
{{- if and (not (empty $value)) (not $skipCraftProxyKey) (not $skipPostgresTlsKey) (not $skipRedisTlsKey) }}
  {{ $key }}: "{{ $value }}"
{{- end }}
{{- end }}
  {{- if eq (include "lumen.postgresTls.enabled" .) "true" }}
  POSTGRES_SSLMODE: {{ .Values.postgresTls.sslMode | default "verify-ca" | quote }}
  POSTGRES_SSLROOTCERT: {{ .Values.postgresTls.caMountPath | default "/etc/postgres-ca/ca.crt" | quote }}
  {{- end }}
  {{- if eq (include "lumen.redisTls.enabled" .) "true" }}
  {{- $redisTls := .Values.redisTls | default dict }}
  REDIS_SSL: "true"
  REDIS_SSL_CERT_REQS: "required"
  REDIS_SSL_CA_CERTS: {{ $redisTls.caMountPath | default "/etc/ssl/certs/redis-ca.crt" | quote }}
  REDIS_SSL_CHECK_HOSTNAME: {{ include "lumen.redisTls.checkHostname" . | quote }}
  {{- end }}
  {{- if .Values.minio.enabled }}
  S3_ENDPOINT_URL: "http://{{ .Release.Name }}-minio:{{ default 9000 .Values.minio.service.port }}"
  {{- end }}
  {{- if $craftEnabled }}
  SANDBOX_PROXY_HOST: "{{ include "lumen.sandboxProxyHost" . }}"
  SANDBOX_PROXY_PORT: "{{ include "lumen.sandboxProxyPort" . }}"
  {{- end }}
