{{- if and .Values.vectorDB.enabled (gt (int .Values.celery_worker_light.replicaCount) 0) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumen.resourceName" (list . "celery-worker-light") }}
  labels:
    {{- include "lumen.labels" . | nindent 4 }}
    {{- with .Values.celery_worker_light.deploymentLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.celery_worker_light.autoscaling.enabled }}
  replicas: {{ .Values.celery_worker_light.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lumen.selectorLabels" . | nindent 6 }}
      {{- if .Values.celery_worker_light.deploymentLabels }}
      {{- toYaml .Values.celery_worker_light.deploymentLabels | nindent 6 }}
      {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- with .Values.celery_worker_light.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lumen.labels" . | nindent 8 }}
        {{- with .Values.celery_worker_light.deploymentLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.celery_worker_light.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lumen.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.celery_shared.podSecurityContext | nindent 8 }}
      {{- with .Values.celery_worker_light.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.celery_worker_light.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.celery_worker_light.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: celery-worker-light
          securityContext:
            {{- toYaml .Values.celery_shared.securityContext | nindent 12 }}
          image: "{{ .Values.celery_shared.image.repository }}:{{ .Values.celery_shared.image.tag | default .Values.global.version }}"
          imagePullPolicy: {{ .Values.global.pullPolicy }}
          command:
            [
              {{- with include "lumen.customCACerts.commandPrefix" . }}
              {{- . | nindent 14 }}
              {{- end }}
              "celery",
              "-A",
              "lumen.background.celery.versioned_apps.light",
              "worker",
              {{- with .Values.celery_worker_light.logLevel }}
              {{ printf "--loglevel=%s" . | quote }},
              {{- end }}
              "--hostname=light@%n",
              "-Q",
              "vespa_metadata_sync,connector_deletion,doc_permissions_upsert,checkpoint_cleanup,index_attempt_cleanup,index_reclaim,opensearch_migration,chat_ttl_deletion",
            ]
          ports:
            - name: metrics
              containerPort: 9095
              protocol: TCP
          resources:
            {{- toYaml .Values.celery_worker_light.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ .Values.config.envConfigMapName }}
            {{- with .Values.extraEnvFromSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          env:
            {{- include "lumen.envSecrets" . | nindent 12}}
            {{- with include "lumen.customCACerts.env" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.celery_worker_light.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with include "lumen.volumeMountsWithCA" (dict "ctx" . "volumeMounts" .Values.celery_worker_light.volumeMounts) }}
          {{- . | nindent 10 }}
          {{- end }}
          startupProbe:
            {{ .Values.celery_shared.startupProbe | toYaml | nindent 12}}
          readinessProbe:
            {{ .Values.celery_shared.readinessProbe | toYaml | nindent 12}}
            exec:
              command:
                - /bin/bash
                - -c
                - >
                    python lumen/background/celery/celery_k8s_probe.py
                    --probe readiness
                    --filename /tmp/lumen_k8s_light_readiness.txt
          livenessProbe:
            {{ .Values.celery_shared.livenessProbe | toYaml | nindent 12}}
            exec:
              command:
                - /bin/bash
                - -c
                - >
                    python lumen/background/celery/celery_k8s_probe.py
                    --probe liveness
                    --filename /tmp/lumen_k8s_light_liveness.txt
      {{- with include "lumen.volumesWithCA" (dict "ctx" . "volumes" .Values.celery_worker_light.volumes) }}
      {{- . | nindent 6 }}
      {{- end }}
{{- end }}
