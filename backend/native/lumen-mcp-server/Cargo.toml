[package]
name = "lumen-mcp-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Lumen MCP server: HTTP transport with bearer auth delegated to the Lumen API"

[[bin]]
name = "lumen-mcp-server"
path = "src/main.rs"

[lib]
name = "lumen_mcp_server"
path = "src/lib.rs"

[dependencies]
