global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Lumen API server — exposes /metrics via prometheus-fastapi-instrumentator
  # Port matches the API Server launch config in .vscode/launch.json
  - job_name: 'lumen-api-server'
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8080']

  # Lumen celery workers — each exposes /metrics on a dedicated port
  - job_name: 'lumen-monitoring-worker'
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9096']

  - job_name: 'lumen-docfetching-worker'
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9092']

  - job_name: 'lumen-docprocessing-worker'
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9093']

  - job_name: 'lumen-heavy-worker'
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9094']

  - job_name: 'lumen-light-worker'
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9095']
